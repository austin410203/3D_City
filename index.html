<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>文明物語 Civilization</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>

<div id="loading"><div class="logo">🏛️ 文明物語</div><div class="bar"><div id="loadbar"></div></div><div id="loadtxt">載入模型中…</div></div>

<header id="hud">
  <div id="era" class="chip"></div>
  <div class="stat" title="年份"><span>📅</span><b id="s-year"></b></div>
  <div class="stat" title="人口"><span>👥</span><b id="s-pop">0</b></div>
  <div class="stat" title="工作"><span>💼</span><b id="s-jobs">0</b></div>
  <div class="stat" title="滿意度"><span id="s-hapicon">🙂</span><b id="s-hap">0</b></div>
  <div class="stat" title="資源 使用/供應"><span id="s-resic">💧</span><b id="s-res">0/0</b></div>
  <div class="speed" id="speeds" title="觀看速度（空白鍵暫停）"></div>
  <button id="orbit" class="iconbtn" title="自動環繞鏡頭 (R)">🎥</button>
  <button id="menuBtn" class="iconbtn" title="選擇地圖與時代">🗺️</button>
</header>

<aside id="side">
  <div class="pros">
    <div class="pros-top"><span>繁榮度</span><b id="pros-val">0%</b></div>
    <div class="pros-bar"><div id="pros-fill"></div><i title="極致繁榮"></i></div>
    <div id="pros-detail"></div>
  </div>
  <div class="rci">
    <span>需求</span>
    <div class="rcol"><div class="rbar"><div id="d-r" class="fill r"></div></div>住</div>
    <div class="rcol"><div class="rbar"><div id="d-c" class="fill c"></div></div>商</div>
    <div class="rcol"><div class="rbar"><div id="d-i" class="fill i"></div></div>產</div>
  </div>
  <div class="logtitle"><span>📜 編年史</span><button id="logToggle">▾</button></div>
  <div id="log"></div>
</aside>

<div id="info" class="hidden"></div>
<div id="toasts"></div>
<div id="hint">點擊建築查看資訊 · 左鍵拖曳平移 · 右鍵旋轉 · 滾輪縮放 · 空白鍵暫停</div>

<div id="levels" class="hidden">
  <div class="lvwrap">
    <h1>🏛️ 文明物語 <span>選擇時代與地圖，觀看文明從無到有、發展到極致繁榮</span></h1>
    <div id="eraList"></div>
    <div id="eraDesc"></div>
    <div id="levelList"></div>
  </div>
</div>

<div id="victory" class="hidden"></div>

<script type="module" src="main.js"></script>
</body>
</html>
